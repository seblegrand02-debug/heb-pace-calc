<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur d'Allure & Temps de Course</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ea580c;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Distances standards en km
    const DISTANCES = [
      { id: '100m', name: '100m', km: 0.1, icon: 'fa-bolt' },
      { id: '400m', name: '400m', km: 0.4, icon: 'fa-stopwatch' },
      { id: '1k', name: '1 km', km: 1, icon: 'fa-person-running' },
      { id: '5k', name: '5 km', km: 5, icon: 'fa-fire' },
      { id: '10k', name: '10 km', km: 10, icon: 'fa-medal' },
      { id: 'semi', name: 'Semi-Marathon', km: 21.0975, icon: 'fa-trophy', highlight: true },
      { id: 'marathon', name: 'Marathon', km: 42.195, icon: 'fa-crown' },
    ];

    function FormatTime({ totalSeconds, showSubSec = false }) {
      if (isNaN(totalSeconds) || totalSeconds <= 0) return <span>--:--</span>;
      
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = Math.floor(totalSeconds % 60);
      const subSec = Math.round((totalSeconds % 1) * 10);

      if (hrs > 0) {
        return (
          <span className="font-mono">
            <strong className="text-xl sm:text-2xl font-bold">{hrs}</strong>
            <span className="text-xs text-slate-400 mr-1">h</span>
            <strong className="text-xl sm:text-2xl font-bold">{String(mins).padStart(2, '0')}</strong>
            <span className="text-xs text-slate-400 mr-1">m</span>
            <strong className="text-xl sm:text-2xl font-bold">{String(secs).padStart(2, '0')}</strong>
            <span className="text-xs text-slate-400">s</span>
          </span>
        );
      }

      return (
        <span className="font-mono">
          <strong className="text-xl sm:text-2xl font-bold">{mins}</strong>
          <span className="text-xs text-slate-400 mr-1">m</span>
          <strong className="text-xl sm:text-2xl font-bold">{String(secs).padStart(2, '0')}</strong>
          {showSubSec && (
            <span className="text-sm text-amber-400 font-semibold">.{subSec}</span>
          )}
          <span className="text-xs text-slate-400 ml-0.5">s</span>
        </span>
      );
    }

    function App() {
      // Base state: speed in km/h
      const [speedKmh, setSpeedKmh] = useState(12.0); // Default 12 km/h = 5:00 min/km
      const [customDist, setCustomDist] = useState(15);
      const [activeTab, setActiveTab] = useState('converter'); // 'converter', 'splits', 'zones'
      const [splitDistance, setSplitDistance] = useState('semi'); // default split focus on semi

      // Calculated variables derived from speed
      const paceSecondsPerKm = speedKmh > 0 ? 3600 / speedKmh : 0;
      const time100mSec = speedKmh > 0 ? 360 / speedKmh : 0;

      // Handlers for direct inputs
      const handleSpeedChange = (val) => {
        const num = parseFloat(val);
        if (!isNaN(num) && num > 0) {
          setSpeedKmh(Math.min(Math.max(num, 3), 35));
        }
      };

      const handlePaceChange = (mins, secs) => {
        const m = parseInt(mins) || 0;
        const s = parseInt(secs) || 0;
        const totalSecs = m * 60 + s;
        if (totalSecs > 0) {
          const newSpeed = 3600 / totalSecs;
          setSpeedKmh(Math.min(Math.max(newSpeed, 3), 35));
        }
      };

      const handle100mChange = (secs) => {
        const s = parseFloat(secs);
        if (!isNaN(s) && s > 0) {
          const newSpeed = 360 / s;
          setSpeedKmh(Math.min(Math.max(newSpeed, 3), 35));
        }
      };

      const handleRaceTimeChange = (distKm, hrsInput, minsInput, secsInput) => {
        const h = parseInt(hrsInput) || 0;
        const m = parseInt(minsInput) || 0;
        const s = parseInt(secsInput) || 0;
        const totalSeconds = h * 3600 + m * 60 + s;
        if (totalSeconds > 0 && distKm > 0) {
          const paceSec = totalSeconds / distKm;
          const newSpeed = 3600 / paceSec;
          setSpeedKmh(Math.min(Math.max(newSpeed, 3), 35));
        }
      };

      // Current min/km values for input bindings
      const currentPaceMins = Math.floor(paceSecondsPerKm / 60);
      const currentPaceSecs = Math.round(paceSecondsPerKm % 60);

      // Selected split target distance
      const getSplitTarget = () => {
        if (splitDistance === 'semi') return { name: 'Semi-Marathon', km: 21.0975 };
        if (splitDistance === 'marathon') return { name: 'Marathon', km: 42.195 };
        if (splitDistance === '10k') return { name: '10 km', km: 10 };
        return { name: `Personnalisé (${customDist} km)`, km: parseFloat(customDist) || 10 };
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-6 sm:py-10">
          
          {/* Header */}
          <header className="text-center mb-8 sm:mb-12">
            <div className="inline-flex items-center gap-2 bg-gradient-to-r from-orange-500/10 to-amber-500/10 border border-orange-500/20 px-4 py-1.5 rounded-full text-orange-400 text-xs sm:text-sm font-medium mb-3">
              <i className="fa-solid fa-person-running text-orange-500"></i>
              Calculateur & Convertisseur d'Allures
            </div>
            <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-2">
              Vitesse, Allure & Temps au <span className="bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">Semi-Marathon</span>
            </h1>
            <p className="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto">
              Convertissez instantanément vos km/h en min/km, temps au 100m, et estimez vos chronos du 5k au marathon.
            </p>
          </header>

          {/* Main Speed Control Slider Card */}
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl mb-8 relative overflow-hidden">
            <div className="absolute -right-12 -top-12 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
              
              {/* Vitesse km/h */}
              <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 text-center relative group focus-within:border-orange-500 transition">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
                  Vitesse (km/h)
                </label>
                <div className="flex items-center justify-center gap-1">
                  <input
                    type="number"
                    step="0.1"
                    min="3"
                    max="35"
                    value={parseFloat(speedKmh.toFixed(1))}
                    onChange={(e) => handleSpeedChange(e.target.value)}
                    className="w-28 text-center text-4xl sm:text-5xl font-black bg-transparent text-orange-400 focus:outline-none"
                  />
                  <span className="text-slate-500 font-medium text-lg self-end pb-2">km/h</span>
                </div>
              </div>

              {/* Allure min/km */}
              <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 text-center relative focus-within:border-amber-500 transition">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
                  Allure (min / km)
                </label>
                <div className="flex items-center justify-center gap-1 text-3xl sm:text-4xl font-black text-amber-400">
                  <input
                    type="number"
                    min="1"
                    max="20"
                    value={currentPaceMins}
                    onChange={(e) => handlePaceChange(e.target.value, currentPaceSecs)}
                    className="w-14 text-center bg-transparent focus:outline-none focus:ring-1 focus:ring-amber-500/50 rounded"
                  />
                  <span className="text-slate-500 text-2xl">:</span>
                  <input
                    type="number"
                    min="0"
                    max="59"
                    value={String(currentPaceSecs).padStart(2, '0')}
                    onChange={(e) => handlePaceChange(currentPaceMins, e.target.value)}
                    className="w-16 text-center bg-transparent focus:outline-none focus:ring-1 focus:ring-amber-500/50 rounded"
                  />
                  <span className="text-slate-500 font-medium text-base self-end pb-1 ml-1">/km</span>
                </div>
              </div>

              {/* Temps au 100m */}
              <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 text-center relative focus-within:border-emerald-500 transition">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
                  Temps au 100m
                </label>
                <div className="flex items-center justify-center gap-1">
                  <input
                    type="number"
                    step="0.1"
                    value={parseFloat(time100mSec.toFixed(1))}
                    onChange={(e) => handle100mChange(e.target.value)}
                    className="w-28 text-center text-3xl sm:text-4xl font-black bg-transparent text-emerald-400 focus:outline-none"
                  />
                  <span className="text-slate-500 font-medium text-lg self-end pb-1">s</span>
                </div>
              </div>

            </div>

            {/* Slider Control */}
            <div className="mt-8 pt-6 border-t border-slate-800/80">
              <div className="flex justify-between items-center text-xs font-medium text-slate-400 mb-2">
                <span>Régler la vitesse interactivement :</span>
                <span className="text-orange-400 font-bold">{speedKmh.toFixed(1)} km/h</span>
              </div>
              <input
                type="range"
                min="5.0"
                max="25.0"
                step="0.1"
                value={speedKmh}
                onChange={(e) => setSpeedKmh(parseFloat(e.target.value))}
                className="w-full h-3 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-orange-500 focus:outline-none"
              />
              <div className="flex justify-between text-[11px] text-slate-600 mt-1 font-mono">
                <span>5 km/h (12:00/km)</span>
                <span>10 km/h (6:00/km)</span>
                <span>15 km/h (4:00/km)</span>
                <span>20 km/h (3:00/km)</span>
                <span>25 km/h (2:24/km)</span>
              </div>
            </div>

          </div>

          {/* Tab Navigation */}
          <div className="flex justify-center mb-8 border-b border-slate-800 pb-2 gap-2 sm:gap-4">
            <button
              onClick={() => setActiveTab('converter')}
              className={`px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition flex items-center gap-2 ${
                activeTab === 'converter'
                  ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-900'
              }`}
            >
              <i className="fa-solid fa-calculator"></i>
              Temps par Course
            </button>
            <button
              onClick={() => setActiveTab('splits')}
              className={`px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition flex items-center gap-2 ${
                activeTab === 'splits'
                  ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-900'
              }`}
            >
              <i className="fa-solid fa-list-ol"></i>
              Passages au Semi & Splits
            </button>
            <button
              onClick={() => setActiveTab('zones')}
              className={`px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition flex items-center gap-2 ${
                activeTab === 'zones'
                  ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-900'
              }`}
            >
              <i className="fa-solid fa-gauge-high"></i>
              Zones d'Entraînement
            </button>
          </div>

          {/* TAB 1: Race Estimates (with Highlighted Semi-Marathon) */}
          {activeTab === 'converter' && (
            <div className="space-y-6">
              
              {/* Special Highlight Banner for Semi-Marathon */}
              {(() => {
                const semiSec = paceSecondsPerKm * 21.0975;
                const hrs = Math.floor(semiSec / 3600);
                const mins = Math.floor((semiSec % 3600) / 60);
                const secs = Math.floor(semiSec % 60);

                return (
                  <div className="bg-gradient-to-r from-orange-600 to-amber-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6 border border-orange-400/30">
                    <div className="space-y-2 text-center md:text-left z-10">
                      <div className="inline-flex items-center gap-2 bg-black/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider text-amber-200">
                        <i className="fa-solid fa-star"></i> Objectif Phare
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-black">
                        Temps estimé au Semi-Marathon
                      </h2>
                      <p className="text-orange-100 text-sm max-w-lg">
                        Distance officielle : <strong>21,0975 km</strong> à une vitesse constante de <strong>{speedKmh.toFixed(1)} km/h</strong> ({currentPaceMins}:{String(currentPaceSecs).padStart(2, '0')} min/km).
                      </p>
                    </div>

                    <div className="bg-slate-950/90 backdrop-blur-md border border-orange-400/40 rounded-2xl p-5 text-center min-w-[240px] z-10 shadow-2xl">
                      <span className="block text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">
                        Chrono Semi-Marathon
                      </span>
                      <div className="text-3xl sm:text-4xl font-black text-amber-400 font-mono">
                        {hrs > 0 && <span>{hrs}<span className="text-lg text-slate-400">h </span></span>}
                        <span>{String(mins).padStart(2, '0')}<span className="text-lg text-slate-400">m </span></span>
                        <span>{String(secs).padStart(2, '0')}<span className="text-lg text-slate-400">s</span></span>
                      </div>
                      <div className="text-[11px] text-slate-400 mt-2">
                        Passage au 10k : <strong className="text-slate-200"><FormatTime totalSeconds={paceSecondsPerKm * 10} /></strong>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* All Distances Cards Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {DISTANCES.map((dist) => {
                  const totalSec = paceSecondsPerKm * dist.km;
                  const isSemi = dist.id === 'semi';

                  return (
                    <div
                      key={dist.id}
                      className={`bg-slate-900 border rounded-2xl p-5 transition-all flex flex-col justify-between ${
                        isSemi
                          ? 'border-orange-500/60 bg-gradient-to-b from-slate-900 to-orange-950/20 shadow-lg shadow-orange-500/10'
                          : 'border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-sm ${
                            isSemi ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-300'
                          }`}>
                            <i className={`fa-solid ${dist.icon}`}></i>
                          </div>
                          <div>
                            <h3 className="font-bold text-slate-100 flex items-center gap-2">
                              {dist.name}
                              {isSemi && <span className="bg-orange-500/20 text-orange-400 text-[10px] px-2 py-0.5 rounded-full uppercase font-bold">Incontournable</span>}
                            </h3>
                            <span className="text-xs text-slate-500">{dist.km} km</span>
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-right mt-2">
                        <span className="block text-[10px] uppercase text-slate-500 font-semibold mb-0.5">Temps estimé</span>
                        <div className="text-slate-100">
                          <FormatTime totalSeconds={totalSec} showSubSec={dist.km < 1} />
                        </div>
                      </div>
                    </div>
                  );
                })}

                {/* Custom Distance Card */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center">
                        <i className="fa-solid fa-sliders"></i>
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-100">Distance Perso</h3>
                        <span className="text-xs text-slate-500">Choix libre</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1">
                      <input
                        type="number"
                        min="0.1"
                        max="200"
                        step="0.5"
                        value={customDist}
                        onChange={(e) => setCustomDist(Math.max(0.1, parseFloat(e.target.value) || 1))}
                        className="w-12 text-center text-sm font-bold bg-transparent text-orange-400 focus:outline-none"
                      />
                      <span className="text-xs text-slate-500">km</span>
                    </div>
                  </div>

                  <div className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-right mt-2">
                    <span className="block text-[10px] uppercase text-slate-500 font-semibold mb-0.5">Temps estimé ({customDist} km)</span>
                    <div className="text-slate-100">
                      <FormatTime totalSeconds={paceSecondsPerKm * (parseFloat(customDist) || 10)} />
                    </div>
                  </div>
                </div>

              </div>

            </div>
          )}

          {/* TAB 2: Split Times Matrix (Tableau des Passages) */}
          {activeTab === 'splits' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8">
              
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-6 border-b border-slate-800">
                <div>
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-list-ol text-orange-500"></i>
                    Tableau des Temps de Passage (Splits)
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Visualisez vos temps à chaque kilomètre à l'allure constante de <strong>{currentPaceMins}:{String(currentPaceSecs).padStart(2, '0')}/km</strong> ({speedKmh.toFixed(1)} km/h).
                  </p>
                </div>

                {/* Select Split Focus */}
                <div className="flex items-center gap-2 bg-slate-950 border border-slate-800 p-1 rounded-xl">
                  <button
                    onClick={() => setSplitDistance('10k')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                      splitDistance === '10k' ? 'bg-orange-500 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    10k
                  </button>
                  <button
                    onClick={() => setSplitDistance('semi')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                      splitDistance === 'semi' ? 'bg-orange-500 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Semi-Marathon
                  </button>
                  <button
                    onClick={() => setSplitDistance('marathon')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                      splitDistance === 'marathon' ? 'bg-orange-500 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Marathon
                  </button>
                </div>
              </div>

              {/* Splits Table */}
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead>
                    <tr className="border-b border-slate-800 text-xs text-slate-400 uppercase tracking-wider">
                      <th className="py-3 px-4">Distance</th>
                      <th className="py-3 px-4">Repère</th>
                      <th className="py-3 px-4">Temps Cumulé</th>
                      <th className="py-3 px-4 text-right">Allure Moyenne</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/50">
                    {(() => {
                      const target = getSplitTarget();
                      const totalKm = target.km;
                      const rows = [];
                      
                      let current = 1;
                      const keyPoints = [5, 10, 15, 20, 21.0975, 25, 30, 35, 40, 42.195];

                      for (let k = 1; k <= Math.ceil(totalKm); k++) {
                        const prevKm = k - 1;
                        keyPoints.forEach(kp => {
                          if (kp > prevKm && kp < k && kp <= totalKm) {
                            rows.push({ km: kp, isKey: true });
                          }
                        });

                        if (k <= totalKm) {
                          rows.push({ km: k, isKey: k % 5 === 0 });
                        } else if (totalKm % 1 !== 0) {
                          rows.push({ km: totalKm, isKey: true });
                        }
                      }

                      return rows.map((row, idx) => {
                        const seconds = paceSecondsPerKm * row.km;
                        const isFinal = Math.abs(row.km - totalKm) < 0.001;

                        return (
                          <tr
                            key={idx}
                            className={`hover:bg-slate-800/40 transition ${
                              isFinal
                                ? 'bg-orange-500/20 text-orange-200 font-bold'
                                : row.isKey
                                ? 'bg-slate-800/20 font-semibold text-slate-200'
                                : 'text-slate-400'
                            }`}
                          >
                            <td className="py-3 px-4 flex items-center gap-2">
                              {isFinal ? (
                                <i className="fa-solid fa-flag-checkered text-orange-400"></i>
                              ) : row.isKey ? (
                                <i className="fa-solid fa-location-dot text-amber-400 text-xs"></i>
                              ) : (
                                <span className="w-2 h-2 rounded-full bg-slate-700 inline-block"></span>
                              )}
                              <span>{row.km.toLocaleString('fr-FR', { maximumFractionDigits: 4 })} km</span>
                            </td>
                            <td className="py-3 px-4 text-xs text-slate-500">
                              {isFinal ? 'ARRIVÉE' : row.km === 21.0975 ? 'SEMI-MARATHON' : row.km % 5 === 0 ? `Km ${row.km}` : '-'}
                            </td>
                            <td className="py-3 px-4 font-mono text-slate-100">
                              <FormatTime totalSeconds={seconds} />
                            </td>
                            <td className="py-3 px-4 text-right font-mono text-xs text-slate-400">
                              {currentPaceMins}:{String(currentPaceSecs).padStart(2, '0')} /km
                            </td>
                          </tr>
                        );
                      });
                    })()}
                  </tbody>
                </table>
              </div>

            </div>
          )}

          {/* TAB 3: Training Zones */}
          {activeTab === 'zones' && (
            <div className="space-y-6">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8">
                <h2 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                  <i className="fa-solid fa-gauge-high text-orange-500"></i>
                  Zones d'Entraînement Estimées (VMA & Allures)
                </h2>
                <p className="text-xs text-slate-400 mb-6">
                  Si l'allure sélectionnée (<strong>{speedKmh.toFixed(1)} km/h</strong>) correspond à votre allure cible de compétition, voici les équivalents d'entraînement recommandés :
                </p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  
                  {/* EF */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full">
                        Endurance Fondamentale (EF)
                      </span>
                      <span className="text-xs text-slate-500">65-75% VMA</span>
                    </div>
                    <p className="text-xs text-slate-400 mb-3">Aisance respiratoire totale, idéale pour 80% de vos sorties.</p>
                    <div className="flex justify-between items-baseline font-mono text-slate-200 text-sm">
                      <span>Vitesse : <strong>{(speedKmh * 0.70).toFixed(1)} - {(speedKmh * 0.75).toFixed(1)} km/h</strong></span>
                    </div>
                  </div>

                  {/* Allure Specific Semi */}
                  <div className="bg-slate-950 border border-orange-500/40 rounded-2xl p-5 bg-gradient-to-br from-slate-950 to-orange-950/20">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-orange-400 bg-orange-500/10 px-2.5 py-1 rounded-full">
                        Allure Spécifique Semi
                      </span>
                      <span className="text-xs text-orange-300 font-semibold">85% VMA</span>
                    </div>
                    <p className="text-xs text-slate-400 mb-3">Allure cible maintenable sur 21 km avec une bonne préparation.</p>
                    <div className="flex justify-between items-baseline font-mono text-orange-300 text-sm font-bold">
                      <span>Vitesse : {speedKmh.toFixed(1)} km/h</span>
                      <span>Allure : {currentPaceMins}:{String(currentPaceSecs).padStart(2, '0')}/km</span>
                    </div>
                  </div>

                  {/* Seuil Anaérobie */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full">
                        Seuil Anaérobie (Allure 10k)
                      </span>
                      <span className="text-[11px] text-slate-500">88-92% VMA</span>
                    </div>
                    <p className="text-xs text-slate-400 mb-3">Sensation d'effort soutenu ("inconfort confortable").</p>
                    <div className="flex justify-between items-baseline font-mono text-slate-200 text-sm">
                      <span>Vitesse : <strong>{(speedKmh * 1.06).toFixed(1)} km/h</strong></span>
                    </div>
                  </div>

                  {/* VMA */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-full">
                        VMA / Vitesse Maximale
                      </span>
                      <span className="text-[11px] text-slate-500">100% VMA</span>
                    </div>
                    <p className="text-xs text-slate-400 mb-3">Fractionné court / moyen (ex: 30/30, 400m).</p>
                    <div className="flex justify-between items-baseline font-mono text-slate-200 text-sm">
                      <span>VMA estimée : <strong>{(speedKmh / 0.85).toFixed(1)} km/h</strong></span>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-900 pt-6">
            <p>© Calculateur d'Allures & Temps de Passage pour Course à Pied</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
